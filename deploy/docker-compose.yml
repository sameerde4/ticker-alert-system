# Market Radar demo stack for the EC2 host.
# From /opt/market-radar: docker compose -f deploy/docker-compose.yml up -d --build
#
# Logs: awslogs → CloudWatch group /market-radar/demo (Terraform). Requires the
# EC2 instance profile (logs:PutLogEvents). Local laptop runs can drop logging
# or leave it — awslogs only works on the AWS host with IAM.

x-awslogs: &awslogs-driver
  driver: awslogs

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticker_alert_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    logging:
      <<: *awslogs-driver
      options:
        awslogs-region: us-east-1
        awslogs-group: /market-radar/demo
        awslogs-create-group: "false"
        awslogs-stream: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticker_alert_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    logging:
      <<: *awslogs-driver
      options:
        awslogs-region: us-east-1
        awslogs-group: /market-radar/demo
        awslogs-create-group: "false"
        awslogs-stream: kafka
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s

  migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../db/migrations:/migrations:ro
      - ./migrate.sh:/migrate.sh:ro
    entrypoint: ["/bin/sh", "/migrate.sh"]
    restart: "no"
    logging:
      <<: *awslogs-driver
      options:
        awslogs-region: us-east-1
        awslogs-group: /market-radar/demo
        awslogs-create-group: "false"
        awslogs-stream: migrate

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8010:8010"
    environment:
      TICKER_ALERT_APP_ENV: aws-demo
      TICKER_ALERT_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ticker_alert_db
      TICKER_ALERT_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TICKER_ALERT_LAKE_ROOT: /data/lake
      TICKER_ALERT_LAKE_AUTO_ENABLED: "true"
      # Durable lake of record (IAM instance profile on the EC2 host).
      TICKER_ALERT_LAKE_S3_BUCKET: market-radar-lake
      TICKER_ALERT_LAKE_S3_REGION: us-east-1
      # Start disarmed on the demo host; click the Home cue to arm when presenting.
      TICKER_ALERT_LIVE_DISARM_ON_BOOT: "true"
    volumes:
      - lake:/data/lake
      - hfcache:/data/hf
    logging:
      <<: *awslogs-driver
      options:
        awslogs-region: us-east-1
        awslogs-group: /market-radar/demo
        awslogs-create-group: "false"
        awslogs-stream: api

  live:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_started
    environment:
      TICKER_ALERT_APP_ENV: aws-demo
      TICKER_ALERT_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ticker_alert_db
      TICKER_ALERT_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TICKER_ALERT_LAKE_ROOT: /data/lake
      TICKER_ALERT_LAKE_AUTO_ENABLED: "false"
      TICKER_ALERT_LAKE_S3_BUCKET: market-radar-lake
      TICKER_ALERT_LAKE_S3_REGION: us-east-1
    volumes:
      - lake:/data/lake
      - hfcache:/data/hf
    command: ["python", "-m", "app.live"]
    logging:
      <<: *awslogs-driver
      options:
        awslogs-region: us-east-1
        awslogs-group: /market-radar/demo
        awslogs-create-group: "false"
        awslogs-stream: live

  producer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ingest
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      api:
        condition: service_started
    env_file:
      - alpaca.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Full S&P from symbols file. Settings → Live WebSocket picks up to 30 names
      # (polled via LIVE_CONTROL_URL). Env priority is fallback if the API is down.
      ALPACA_WS_PRIORITY_SYMBOLS: ${DEMO_SYMBOLS:-AAPL,MSFT,NVDA,GOOGL,AMZN,META,TSLA,JPM,XOM,UNH}
      ALPACA_WS_SYMBOL_LIMIT: "30"
      REST_POLL_ENABLED: "true"
      REST_POLL_SECONDS: "60"
      LIVE_CONTROL_URL: http://api:8010/v1/live/status
      LIVE_CONTROL_POLL_SECONDS: "3"
    logging:
      <<: *awslogs-driver
      options:
        awslogs-region: us-east-1
        awslogs-group: /market-radar/demo
        awslogs-create-group: "false"
        awslogs-stream: producer

volumes:
  pgdata:
  lake:
  hfcache:
